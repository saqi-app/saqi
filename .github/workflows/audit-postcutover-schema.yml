name: Audit deployed corpus schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'saqi-app/saqi' && github.ref == 'refs/heads/main' && github.actor == 'nmaswood'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: typescript/.nvmrc
      - run: corepack enable && yarn install --immutable --mode=skip-build
      - name: Read deployed table and publication counts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATE_TOKEN }}
        run: |
          sql=$(cat <<'SQL'
          SELECT name FROM sqlite_schema
          WHERE type = 'table' AND name NOT LIKE 'sqlite_%'
            AND name NOT IN ('d1_migrations', '_cf_KV') ORDER BY name;
          SELECT COUNT(*) AS authors FROM author;
          SELECT COUNT(*) AS poems FROM poem;
          SELECT COUNT(*) AS public_poems FROM poem p JOIN author a ON a.id = p.author_id
            WHERE p.publishable = 1;
          SELECT COUNT(*) AS publication_snapshots FROM poem WHERE publication_json IS NOT NULL;
          SELECT COUNT(*) AS source_authors FROM author WHERE source_author_id IS NOT NULL;
          SELECT COUNT(*) AS orphan_poems FROM poem p LEFT JOIN author a ON a.id = p.author_id
            WHERE a.id IS NULL;
          SELECT source_name, COUNT(*) AS authors FROM author
            WHERE source_name IS NOT NULL GROUP BY source_name;
          SELECT COUNT(*) AS unfinished_source_authors FROM author
            WHERE source_author_id IS NOT NULL AND collected_at IS NULL;
          SELECT COUNT(*) AS unpublishable_poems FROM poem WHERE publishable <> 1;
          SELECT COUNT(*) AS unpublishable_publications FROM poem
            WHERE publishable <> 1 AND publication_json IS NOT NULL;
          SELECT COUNT(*) AS legacy_first_line_titles FROM poem
            WHERE poem_title_first_line IS NOT NULL AND trim(poem_title_first_line) <> '';
          SELECT COUNT(*) AS modern_english_titles FROM poem
            WHERE name_english IS NOT NULL AND trim(name_english) <> '';
          SELECT COUNT(*) AS legacy_only_english_titles FROM poem
            WHERE (name_english IS NULL OR trim(name_english) = '')
              AND poem_title_first_line IS NOT NULL AND trim(poem_title_first_line) <> '';
          SELECT COUNT(*) AS source_poems FROM poem WHERE source_poem_id IS NOT NULL;
          SELECT COUNT(*) AS non_aldiwan_authors FROM author
            WHERE source_name IS NOT NULL AND source_name <> 'aldiwan';
          SELECT COUNT(*) AS non_aldiwan_poems FROM poem
            WHERE source_name IS NOT NULL AND source_name <> 'aldiwan';
          SELECT COUNT(*) AS published_verse_mismatch FROM poem
            WHERE publishable = 1 AND json_valid(content_arabic)
              AND verses <> (json_array_length(content_arabic, '$.content') + 1) / 2;
          SELECT COUNT(*) AS published_missing_insights FROM poem
            WHERE publication_json IS NOT NULL
              AND json_type(publication_json, '$.fields.insights') IS NULL;
          SELECT MAX(json_array_length(publication_json, '$.fields.modelEnrichments'))
            AS max_model_tracks FROM poem WHERE publication_json IS NOT NULL;
          SELECT COUNT(*) AS foreign_key_errors FROM pragma_foreign_key_check;
          SELECT type, name, tbl_name, sql FROM sqlite_schema
          WHERE type IN ('table', 'index', 'trigger', 'view')
            AND name NOT LIKE 'sqlite_%' AND name NOT IN ('d1_migrations', '_cf_KV')
          ORDER BY type, name;
          SQL
          )
          yarn workspace @saqi/operations db:execute --remote --json --command "$sql"
