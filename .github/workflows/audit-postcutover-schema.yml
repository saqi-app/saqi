name: Audit deployed corpus schema

on:
  workflow_dispatch:
    inputs:
      totals_only:
        description: Read translated poem totals without the full schema audit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'saqi-app/saqi' && github.ref == 'refs/heads/main' && github.actor == 'nmaswood'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: typescript/.nvmrc
      - run: corepack enable && yarn install --immutable --mode=skip-build
      - name: Count poems with English translations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          started_at = datetime.now(timezone.utc).isoformat()
          totals = {"poems": 0, "translatedPoems": 0, "rigPublishedTranslatedPoems": 0, "rigPublicationsWithCurrentSource": 0, "rigPublicationsPendingCachePurge": 0}
          samples = []
          whitespace = [*range(9, 14), 32, 160, 5760, *range(8192, 8203), 8232, 8233, 8239, 8287, 12288, 65279]
          whitespace_sql = " || ".join(f"char({codepoint})" for codepoint in whitespace)
          # Cover every ID, including non-UUID legacy IDs, with disjoint ranges.
          boundaries = ["", *"123456789abcdef", None]
          for lower, upper in zip(boundaries, boundaries[1:]):
              upper_bound = f"AND p.id < '{upper}'" if upper is not None else ""
              sql = f"""
              WITH translation_presence AS (
                SELECT p.id,
                p.source_hash, p.publication_source_hash,
                p.publication_cache_dirty AS cache_dirty,
                coalesce((
                  EXISTS (
                    SELECT 1 FROM json_each(p.publication_json, '$.fields.linesEnglish') line
                    WHERE line.type = 'text' AND trim(line.value, {whitespace_sql}) <> ''
                  ) OR EXISTS (
                    SELECT 1 FROM json_each(p.publication_json, '$.fields.linesEnglishSol') line
                    WHERE line.type = 'text' AND trim(line.value, {whitespace_sql}) <> ''
                  ) OR EXISTS (
                    SELECT 1 FROM json_each(p.publication_json, '$.fields.linesEnglishGemini') line
                    WHERE line.type = 'text' AND trim(line.value, {whitespace_sql}) <> ''
                  ) OR EXISTS (
                    SELECT 1 FROM json_each(p.publication_json, '$.fields.modelEnrichments') track,
                      json_each(track.value, '$.lines') line
                    WHERE line.type = 'text' AND trim(line.value, {whitespace_sql}) <> ''
                  )
                ), 0) AS has_english,
                coalesce(json_extract(p.publication_json, '$.active'), 0) AS active
                FROM poem p JOIN author a ON a.id = p.author_id
                WHERE p.id >= '{lower}' {upper_bound}
              )
              SELECT count(*) AS poems,
                coalesce(sum(has_english), 0) AS translatedPoems,
                coalesce(sum(has_english AND active = 1), 0) AS rigPublishedTranslatedPoems,
                coalesce(sum(has_english AND active = 1 AND source_hash IS NOT NULL
                  AND publication_source_hash = source_hash), 0) AS rigPublicationsWithCurrentSource,
                coalesce(sum(has_english AND active = 1 AND cache_dirty = 1), 0) AS rigPublicationsPendingCachePurge,
                min(CASE WHEN has_english AND active = 1 THEN id END) AS rigSampleId,
                min(CASE WHEN has_english AND active = 0 THEN id END) AS legacySampleId
              FROM translation_presence;
              """
              result = subprocess.run(
                  ["yarn", "workspace", "@saqi/operations", "db:execute",
                   "--remote", "--json", "--command", sql],
                  check=True, capture_output=True, text=True,
              )
              responses = json.loads(result.stdout)
              if len(responses) != 1 or not responses[0].get("success"):
                  raise RuntimeError("Translation count query failed")
              row = responses[0]["results"][0]
              samples.append({key: row[key] for key in ("rigSampleId", "legacySampleId")})
              for key in totals:
                  totals[key] += row[key]
          report = {
              "startedAt": started_at,
              "checkedAt": datetime.now(timezone.utc).isoformat(),
              **totals,
              "samples": samples,
          }
          print("SAQI_TRANSLATION_TOTALS " + json.dumps(report), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("Translated poem totals (each poem counted once):\n\n")
              summary.write("`rigPublishedTranslatedPoems` counts completed rig snapshots, not every visible English translation. "
                            "The public site also renders valid legacy snapshots with `active: false`. "
                            "These database counts do not verify every public URL or snapshot schema.\n\n")
              summary.write("```json\n" + json.dumps(report, indent=2) + "\n```\n")
          PY
      - name: Read deployed table and publication counts
        if: inputs.totals_only != true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATE_TOKEN }}
        run: |
          sql=$(cat <<'SQL'
          SELECT name FROM sqlite_schema
          WHERE type = 'table' AND name NOT LIKE 'sqlite_%'
            AND name NOT IN ('d1_migrations', '_cf_KV') ORDER BY name;
          SELECT COUNT(*) AS authors FROM author;
          SELECT COUNT(*) AS poems FROM poem;
          SELECT COUNT(*) AS public_poems FROM poem p JOIN author a ON a.id = p.author_id;
          SELECT COUNT(*) AS publication_snapshots FROM poem WHERE publication_json IS NOT NULL;
          SELECT COUNT(*) AS source_authors FROM author WHERE source_author_id IS NOT NULL;
          SELECT COUNT(*) AS orphan_poems FROM poem p LEFT JOIN author a ON a.id = p.author_id
            WHERE a.id IS NULL;
          SELECT COUNT(*) AS orphan_publications FROM poem
            WHERE author_id IS NULL AND publication_json IS NOT NULL;
          SELECT COUNT(*) AS orphan_source_identities FROM poem
            WHERE author_id IS NULL AND source_poem_id IS NOT NULL;
          SELECT COUNT(*) AS orphan_active_work FROM poem
            WHERE author_id IS NULL AND rig_status IN ('claimed', 'dispatching', 'unknown');
          SELECT COUNT(*) AS orphan_checkpoints FROM poem
            WHERE author_id IS NULL AND rig_checkpoint_json IS NOT NULL;
          SELECT COUNT(*) AS unfinished_source_authors FROM author
            WHERE source_author_id IS NOT NULL AND source_url IS NOT NULL;
          SELECT COUNT(*) AS finished_source_authors FROM author
            WHERE source_author_id IS NOT NULL AND source_url IS NULL;
          SELECT COUNT(*) AS source_url_mismatch FROM author
            WHERE source_author_id IS NOT NULL AND source_url IS NOT NULL
              AND source_url <> 'https://www.aldiwan.net/cat-' || source_author_id;
          SELECT COUNT(*) AS dirty_publication_caches FROM poem
            WHERE publication_cache_dirty = 1;
          SELECT COUNT(*) AS publications_with_dirty_cache FROM poem
            WHERE publication_json IS NOT NULL AND publication_cache_dirty = 1;
          SELECT SUM(length(publication_json)) AS publication_json_bytes,
            MAX(length(publication_json)) AS largest_publication_json_bytes
            FROM poem WHERE publication_json IS NOT NULL;
          SELECT COUNT(*) AS poems_with_broad_insights,
            SUM(length(json_extract(publication_json, '$.fields.insights'))) AS broad_insights_bytes
            FROM poem WHERE json_type(publication_json, '$.fields.insights') IS NOT NULL;
          SELECT COUNT(*) AS poems_with_nested_insights FROM poem p
            WHERE EXISTS (SELECT 1 FROM json_each(p.publication_json, '$.fields.modelEnrichments') track
              WHERE json_type(track.value, '$.insights') IS NOT NULL);
          SELECT COUNT(*) AS poems_with_word_glosses FROM poem p
            WHERE json_type(p.publication_json, '$.fields.wordGlosses') IS NOT NULL
              OR EXISTS (SELECT 1 FROM json_each(p.publication_json, '$.fields.modelEnrichments') track
                WHERE json_type(track.value, '$.wordGlosses') IS NOT NULL);
          SELECT rig_status, COUNT(*) AS active_checkpoints_requiring_insights
            FROM poem p WHERE rig_checkpoint_json IS NOT NULL
              AND EXISTS (SELECT 1 FROM json_each(p.rig_checkpoint_json, '$.required') component
                WHERE component.value = 'insights')
            GROUP BY rig_status;
          SELECT COUNT(*) AS checkpoints_with_insights_payload FROM poem
            WHERE json_type(rig_checkpoint_json, '$.outputs.generation.insights') IS NOT NULL;
          SELECT id AS blocked_poem_id,
            json_extract(rig_checkpoint_json, '$.phase') AS checkpoint_phase,
            json_extract(rig_checkpoint_json, '$.required') AS checkpoint_required,
            json_type(rig_checkpoint_json, '$.invocation') AS invocation_type,
            json_type(rig_checkpoint_json, '$.outputs.generation.insights') AS checkpoint_insights_type,
            json_type(rig_checkpoint_json, '$.outputs.generation.translation.lines') AS translation_type,
            json_array_length(rig_checkpoint_json, '$.outputs.generation.translation.lines') AS translation_lines,
            json_type(rig_checkpoint_json, '$.outputs.generation.wordMeanings') AS meanings_type,
            json_array_length(rig_checkpoint_json, '$.outputs.generation.wordMeanings') AS meaning_lines,
            json_array_length(content_arabic, '$.content') AS source_lines,
            json_type(publication_json, '$.fields.wordGlosses') AS published_glosses_type,
            json_array_length(publication_json, '$.fields.modelEnrichments') AS published_translation_tracks,
            publication_source_hash IS source_hash AS publication_source_current
            FROM poem WHERE rig_status = 'blocked' ORDER BY id;
          SELECT p.id AS verified_poem_id, a.slug AS verified_author_slug,
            p.rig_status AS verified_rig_status,
            p.publication_source_hash = p.source_hash AS verified_source_current,
            json_array_length(p.publication_json, '$.fields.modelEnrichments') AS verified_translation_tracks,
            json_type(p.publication_json, '$.fields.insights') AS verified_insights_type,
            json_type(p.publication_json, '$.fields.wordGlosses') AS verified_glosses_type
            FROM poem p JOIN author a ON a.id = p.author_id
            WHERE p.id = '18f6ccf7-badb-4223-87e1-3c6487924045';
          SELECT COUNT(*) AS modern_english_titles FROM poem
            WHERE name_english IS NOT NULL AND trim(name_english) <> '';
          SELECT COUNT(*) AS source_poems FROM poem WHERE source_poem_id IS NOT NULL;
          SELECT COUNT(*) AS published_verse_mismatch FROM poem
            WHERE json_valid(content_arabic)
              AND verses <> (json_array_length(content_arabic, '$.content') + 1) / 2;
          SELECT COUNT(*) AS published_with_insights FROM poem
            WHERE publication_json IS NOT NULL
              AND json_type(publication_json, '$.fields.insights') IS NOT NULL;
          SELECT MAX(json_array_length(publication_json, '$.fields.modelEnrichments'))
            AS max_model_tracks FROM poem WHERE publication_json IS NOT NULL;
          SELECT COUNT(*) AS foreign_key_errors FROM pragma_foreign_key_check;
          SELECT type, name, tbl_name, sql FROM sqlite_schema
          WHERE type IN ('table', 'index', 'trigger', 'view')
            AND name NOT LIKE 'sqlite_%' AND name NOT IN ('d1_migrations', '_cf_KV')
          ORDER BY type, name;
          SQL
          )
          # Separate statements so the full audit cannot exhaust one D1
          # request's CPU budget by combining all corpus scans.
          statement=""
          while IFS= read -r line; do
            statement+="$line"$'\n'
            if [[ "$line" == *\; ]]; then
              yarn workspace @saqi/operations db:execute --remote --json --command "$statement"
              statement=""
            fi
          done <<< "$sql"
          [[ -z "$statement" ]] || { echo "Unterminated audit statement" >&2; exit 1; }
