name: Verify private corpus restore

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full main SHA approved for this disposable restore
        required: true
        type: string
      manifest_key:
        description: Private saqi-corpus-archive manifest key
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-corpus-restore
  cancel-in-progress: false

jobs:
  restore:
    if: >-
      github.repository == 'saqi-app/saqi' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'nmaswood'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATE_TOKEN }}
      SAQI_ARCHIVE_READ_TOKEN: ${{ secrets.CLOUDFLARE_OPS_DEPLOY_TOKEN }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify commit and allocate disposable name
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          suffix=$(printf '%s' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-12)
          echo "RESTORE_DATABASE=saqi-restore-rehearsal-$suffix" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: typescript/.nvmrc
      - name: Install dependencies
        working-directory: typescript
        run: corepack enable && yarn install --immutable --mode=skip-build
      - name: Test restore safety
        run: |
          python3 typescript/scripts/rehearse-production-d1-restore.test.py
          python3 typescript/scripts/rehearse-production-d1-import.test.py
      - name: Restore and compare every archived row
        env:
          MANIFEST_KEY: ${{ inputs.manifest_key }}
        run: >-
          python3 typescript/scripts/rehearse-production-d1-import.py
          --manifest-key "$MANIFEST_KEY" --database-name "$RESTORE_DATABASE" --execute
      - name: Remove this run's disposable database after interruption
        if: always() && env.RESTORE_DATABASE != ''
        working-directory: typescript/packages/operations
        run: |
          [[ "$RESTORE_DATABASE" =~ ^saqi-restore-rehearsal-[0-9a-f]{12}$ ]]
          yarn wrangler d1 list --json > "$RUNNER_TEMP/restore-databases.json"
          if node -e 'const fs=require("node:fs"); const rows=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.exit(rows.some(row=>row.name===process.env.RESTORE_DATABASE)?0:1)' "$RUNNER_TEMP/restore-databases.json"; then
            yarn wrangler d1 delete "$RESTORE_DATABASE" --skip-confirmation
          fi
