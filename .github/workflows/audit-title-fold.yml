name: Audit legacy title fold

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'saqi-app/saqi' && github.ref == 'refs/heads/main' && github.actor == 'nmaswood'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: typescript/.nvmrc
      - run: corepack enable && yarn install --immutable --mode=skip-build
      - run: yarn workspace @saqi/precedent-iso build
      - name: Check every legacy title and hidden poem without changing D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_MIGRATE_TOKEN }}
        run: node --import tsx scripts/audit-title-fold.mjs
